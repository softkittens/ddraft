<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pen Engine Differential Agreement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; padding: 32px; background: #0f172a; color: #f8fafc;
             font-family: "Inter", system-ui, sans-serif; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
      h2 { font-size: 15px; font-weight: 600; margin: 28px 0 10px; }
      .sub { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
      .summary { font-family: "Geist Mono", monospace; font-size: 15px; padding: 12px 16px;
                 border-radius: 8px; margin-bottom: 20px; display: inline-block; }
      .summary.pass { background: rgba(74, 222, 128, 0.12); border: 1px solid #4ade80; }
      .summary.fail { background: rgba(248, 113, 113, 0.12); border: 1px solid #f87171; }
      table { border-collapse: collapse; width: 100%; max-width: 900px; margin-bottom: 8px;
              font-family: "Geist Mono", monospace; font-size: 13px; }
      th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid #334155; }
      th { color: #94a3b8; font-weight: 500; }
      .pass { color: #4ade80; font-weight: 600; }
      .fail { color: #f87171; font-weight: 600; }
      .diffs { font-size: 12px; }
      .note { color: #94a3b8; font-size: 13px; }
      code { font-family: "Geist Mono", monospace; color: #e2e8f0; }
      button { background: #1e293b; color: #f8fafc; border: 1px solid #475569;
               padding: 7px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
      button:hover { background: #334155; }
    </style>
  </head>
  <body>
    <h1>Pen differential agreement harness</h1>
    <div class="sub">Our layout engine against Pen's reported <code>ctx.bounds</code>, measured with a real font engine.</div>
    <div id="results" class="note">Waiting for fonts, then running…</div>
    <script type="module" src="/src/agreement/agreement.ts"></script>
  </body>
</html>
